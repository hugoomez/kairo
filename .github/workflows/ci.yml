name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: tests + lint (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development machine; Linux is what the
        # external runtimes (Kaggle, Colab) run the bundled scripts on.
        os: [ubuntu-latest, windows-latest]
        # 3.11 is the oldest supported (model_policy.py needs tomllib); the
        # newest catches what a fresh install will run.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Configure git identity for tests that create repos
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate .
