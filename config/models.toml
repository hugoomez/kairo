# Kairo model policy: the one source of truth for which Claude model, and at
# which reasoning effort, each Kairo task runs. Three tiers, each pinned to an
# exact model id (no aliases).
#
#   python scripts/models/model_policy.py show     # the resolved policy (JSON)
#   python scripts/models/model_policy.py check    # agents/ and evolve agree with it
#   python scripts/models/model_policy.py set --task <id> [--tier fable|opus|sonnet] [--effort low|…|max]
#   python scripts/models/model_policy.py set --task <id> --recommended   # or --all --recommended
#                                                   # edits this file and the agent frontmatter
#
# Per task: `tier` and `effort` are what it runs on; `recommended_tier`,
# `recommended_effort` and `why` are Kairo's recommendation, shown next to the
# choice in the interface. A job launched from the interface may override the
# tier and effort for that one run. Effort: low | medium | high | xhigh | max.
# The recommendations follow Anthropic's guidance (start on Opus 5.5, Fable 5.2
# for open-ended hard work; high effort where reasoning or verification pays,
# low for classification and short summaries, where more effort does not help)
# and the research on LLM judges (a verifier is better a different, stronger
# model than the one whose output it checks). xhigh and max are offered, never
# recommended: past high the gains are uneven and the cost is not.
#
# kind = "job"   a task the Kairo interface launches (backend job kind = task id)
# kind = "agent" a subagent; `file` is its definition, whose `model:` line is
#                generated from this policy (check fails if it drifts)
# kind = "tool"  a script that calls a model itself (evolve-program)
#
# isolated = true  (agents) the agent must not read the vault, run commands or
#                reach the network: its only tool is `Read`, which the vault
#                hook (scripts/security/isolation.py) limits to its packet;
#                `check` refuses any other tool. An empty `tools:` inherits every tool.
# reads_papers = true  (agents) the agent reads third-party paper text (notes,
#                cards, abstracts) that may carry instructions aimed at a model:
#                `check` refuses any tool but Read, Grep, Glob and Smart
#                Connections search_by_text / search_similar / get_note.
#
# Tasks with no model at all are not listed: «¿Dónde estaba?», the lab notebook,
# the shareable report, idea capture, numerical checks, repo remote/push.
# The second critic's own judgement runs on DeepSeek (DeepInfra), outside this
# policy; only its Claude wrapper is listed.

[tiers]
fable = "claude-fable-5-2"
opus = "claude-opus-5-5"
sonnet = "claude-sonnet-5-5"

# --- jobs the interface launches --------------------------------------------
