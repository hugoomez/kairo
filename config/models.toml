# Kairo model policy: the one source of truth for which Claude model each
# Kairo task uses. Two tiers, each pinned to an exact model id (no aliases).
#
#   python scripts/models/model_policy.py show     # the resolved policy (JSON)
#   python scripts/models/model_policy.py check    # agents/ and evolve agree with it
#   python scripts/models/model_policy.py set --task <id> --tier opus|sonnet
#                                                   # edits this file and the agent frontmatter
#
# kind = "job"   a task the Kairo interface launches (backend job kind = task id)
# kind = "agent" a subagent; `file` is its definition, whose `model:` line is
#                generated from this policy (check fails if it drifts)
# kind = "tool"  a script that calls a model itself (evolve-program)
#
# Tasks with no model at all are not listed: «¿Dónde estaba?», the lab notebook,
# the shareable report, idea capture, numerical checks, repo remote/push.
# The second critic's own judgement runs on DeepSeek (DeepInfra), outside this
# policy; only its Claude wrapper is listed.

[tiers]
opus = "claude-opus-5-5"
sonnet = "claude-sonnet-5-5"

# --- jobs the interface launches --------------------------------------------
[tasks.hypothesis_generation]
kind = "job"
tier = "opus"
label = "Generar hipótesis (ciclo, críticos y torneo)"

