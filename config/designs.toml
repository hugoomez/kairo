# Registro de diseños de estudio. Cada tabla es un diseño; `designs.py check`
# valida que todo estado, transición y comprobación de puerta esté declarado.
# Prefijos en uso que no se pueden reutilizar: H, C, E, P.

[medicion]
prefix = "Q"
folder = "Preguntas"
statuses = ["abierta", "plan_congelado", "en_recoleccion", "estimada", "sin_respuesta", "descartada"]
terminal = ["estimada", "sin_respuesta", "descartada"]
transitions = [
  ["abierta", "plan_congelado"],
  ["plan_congelado", "en_recoleccion"],
  ["en_recoleccion", "estimada"],
  ["en_recoleccion", "sin_respuesta"],
  ["abierta", "descartada"],
  ["plan_congelado", "descartada"],
]
# Transiciones que solo hace una persona: study_status.py las rechaza dentro de una sesión
# de agente. Descartar va por `discard`; empezar la recolección (plan_congelado →
# en_recoleccion) es la acción del investigador «Empezar la recolección»; el investigador
# decide sin_respuesta (en_recoleccion → sin_respuesta), nunca el agente.
researcher_only = [["abierta", "descartada"], ["plan_congelado", "descartada"], ["plan_congelado", "en_recoleccion"],
                   ["en_recoleccion", "sin_respuesta"]]
# Estado que exige el manuscrito.
publishable = "estimada"
gate = ["plan_frozen", "estimates_reproducible", "classifiers_validated", "verifier_no_errors", "avisos_cerrados"]
plan_prefix = "M"
plan_folder = "Mediciones"
plan_template = "templates/measurement-plan-template.md"
# placement: body (por defecto) | front (el resumen) | appendix (tras la bibliografía, fuera del
# límite de páginas del cuerpo; USENIX los quiere antes de las referencias: config/venues.toml).
manuscript_sections = [
  { id = "abstract", kind = "prosa", placement = "front" },
  { id = "introduction", kind = "prosa" },
  { id = "background", kind = "prosa" },
  { id = "methodology", kind = "prosa" },
  { id = "ethics", kind = "prosa", placement = "appendix" },
  { id = "results", kind = "resultado" },
  { id = "discussion", kind = "cierre" },
  { id = "related-work", kind = "prosa" },
  { id = "open-science", kind = "prosa", placement = "appendix" },
]

# Piloto: una exploración antes del estudio (recuentos, muestras manuales, tamaño de las
# muestras de anotación), que decide si se sigue y cómo. Su plan no se congela y sus datos
# se pueden registrar en cualquier momento; por eso no es citable: el manuscrito se niega a
# apoyar una cifra en él. Sus datos nunca sirven de unidades de la pregunta del estudio: la
# puerta plan_frozen de `medicion` rechaza un dataset (por nombre o huella) registrado antes
# del congelado, como lo estará el del piloto.
[piloto]
prefix = "QP"
folder = "Pilotos"
statuses = ["abierta", "explorada", "descartada"]
terminal = ["explorada", "descartada"]
transitions = [
  ["abierta", "explorada"],
  ["abierta", "descartada"],
]
researcher_only = [["abierta", "descartada"]]
publishable = "explorada"
gate = ["estimates_reproducible"]
plan_prefix = "MP"
plan_folder = "Pilotos"
plan_template = "templates/pilot-plan-template.md"
citable = false
manuscript_sections = []
